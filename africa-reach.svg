<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="continent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f68b1e" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#e07010" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg2)" rx="16"/>
  <!-- Globe circles -->
  <circle cx="200" cy="150" r="110" fill="none" stroke="#f68b1e" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <circle cx="200" cy="150" r="85" fill="none" stroke="#f68b1e" stroke-width="1" stroke-dasharray="3 5" opacity="0.2"/>
  <!-- Africa continent simplified shape -->
  <path d="M180 60 Q200 55 215 68 Q235 72 238 90 Q248 105 245 125 Q255 140 250 158 Q248 175 240 190 Q230 210 215 225 Q205 238 200 242 Q195 248 190 242 Q175 232 165 218 Q152 200 148 182 Q140 165 142 148 Q138 130 145 112 Q148 92 158 78 Z" fill="url(#continent)"/>
  <!-- Country dots/connections -->
  <circle cx="200" cy="100" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="215" cy="130" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="188" cy="150" r="5" fill="#fff" opacity="0.9"/>
  <circle cx="205" cy="175" r="4" fill="#fff" opacity="0.7"/>
  <circle cx="195" cy="200" r="4" fill="#fff" opacity="0.8"/>
  <circle cx="178" cy="170" r="3" fill="#fff" opacity="0.7"/>
  <circle cx="222" cy="155" r="3" fill="#fff" opacity="0.6"/>
  <!-- Connection lines between countries -->
  <line x1="200" y1="100" x2="215" y2="130" stroke="#f68b1e" stroke-width="1" opacity="0.6"/>
  <line x1="215" y1="130" x2="188" y2="150" stroke="#f68b1e" stroke-width="1" opacity="0.6"/>
  <line x1="188" y1="150" x2="205" y2="175" stroke="#f68b1e" stroke-width="1" opacity="0.6"/>
  <line x1="205" y1="175" x2="195" y2="200" stroke="#f68b1e" stroke-width="1" opacity="0.6"/>
  <line x1="188" y1="150" x2="178" y2="170" stroke="#f68b1e" stroke-width="1" opacity="0.5"/>
  <line x1="215" y1="130" x2="222" y2="155" stroke="#f68b1e" stroke-width="1" opacity="0.5"/>
  <!-- Pulsing dots on major cities -->
  <circle cx="200" cy="100" r="10" fill="#f68b1e" opacity="0.2"/>
  <circle cx="188" cy="150" r="10" fill="#f68b1e" opacity="0.2"/>
  <circle cx="195" cy="200" r="8" fill="#f68b1e" opacity="0.2"/>
  <!-- Country labels -->
  <text x="204" y="97" font-family="Arial" font-size="7" fill="white" opacity="0.8">SL</text>
  <text x="192" y="148" font-family="Arial" font-size="7" fill="white" opacity="0.8">GH</text>
  <text x="209" y="128" font-family="Arial" font-size="7" fill="white" opacity="0.7">NG</text>
  <text x="199" y="198" font-family="Arial" font-size="7" fill="white" opacity="0.7">ZA</text>
  <!-- Signal waves from Sierra Leone -->
  <circle cx="200" cy="100" r="18" fill="none" stroke="#f68b1e" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 3"/>
  <circle cx="200" cy="100" r="28" fill="none" stroke="#f68b1e" stroke-width="1" opacity="0.3" stroke-dasharray="2 4"/>
  <!-- Title -->
  <text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#f68b1e">Reach 40+ African Countries</text>
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="3" fill="#f68b1e" opacity="0.4"/>
  <circle cx="370" cy="30" r="3" fill="#f68b1e" opacity="0.4"/>
  <circle cx="30" cy="270" r="3" fill="#f68b1e" opacity="0.4"/>
  <circle cx="370" cy="270" r="3" fill="#f68b1e" opacity="0.4"/>
</svg>
