<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B3F00;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3D1A00;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background wash -->
  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- Geometric pattern — marketplace grid -->
  <!-- Horizontal lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.12"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.10"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.06"/>
  <!-- Vertical lines -->
  <line x1="150" y1="0" x2="150" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.10"/>
  <line x1="300" y1="0" x2="300" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="450" y1="0" x2="450" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.10"/>
  <line x1="750" y1="0" x2="750" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="900" y1="0" x2="900" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.08"/>
  <line x1="1050" y1="0" x2="1050" y2="600" stroke="white" stroke-width="0.5" stroke-dasharray="8 16" opacity="0.10"/>

  <!-- Marketplace product cards (floating) — left side -->
  <g opacity="0.28">
    <rect x="40" y="80" width="110" height="130" rx="12" fill="white"/>
    <rect x="48" y="88" width="94" height="70" rx="6" fill="#f0d4a0"/>
    <rect x="48" y="166" width="60" height="8" rx="3" fill="#ccc"/>
    <rect x="48" y="180" width="40" height="8" rx="3" fill="#f68b1e"/>
  </g>
  <g opacity="0.22">
    <rect x="30" y="240" width="100" height="120" rx="12" fill="white"/>
    <rect x="38" y="248" width="84" height="64" rx="6" fill="#c8e6c9"/>
    <rect x="38" y="318" width="55" height="7" rx="3" fill="#ccc"/>
    <rect x="38" y="330" width="35" height="7" rx="3" fill="#f68b1e"/>
  </g>

  <!-- Marketplace product cards — right side -->
  <g opacity="0.25">
    <rect x="1050" y="100" width="110" height="130" rx="12" fill="white"/>
    <rect x="1058" y="108" width="94" height="70" rx="6" fill="#bbdefb"/>
    <rect x="1058" y="186" width="60" height="8" rx="3" fill="#ccc"/>
    <rect x="1058" y="200" width="40" height="8" rx="3" fill="#f68b1e"/>
  </g>
  <g opacity="0.20">
    <rect x="1060" y="260" width="100" height="115" rx="12" fill="white"/>
    <rect x="1068" y="268" width="84" height="64" rx="6" fill="#f8bbd0"/>
    <rect x="1068" y="338" width="55" height="7" rx="3" fill="#ccc"/>
    <rect x="1068" y="350" width="35" height="7" rx="3" fill="#f68b1e"/>
  </g>

  <!-- Phone mockup center-left -->
  <g opacity="0.18" transform="translate(160, 120) rotate(-8)">
    <rect width="80" height="140" rx="12" fill="white"/>
    <rect x="6" y="16" width="68" height="100" rx="4" fill="#f5f5f5"/>
    <rect x="10" y="20" width="60" height="14" rx="3" fill="#f68b1e"/>
    <rect x="10" y="40" width="27" height="34" rx="3" fill="#e8e8e8"/>
    <rect x="43" y="40" width="27" height="34" rx="3" fill="#e8e8e8"/>
    <rect x="10" y="80" width="27" height="30" rx="3" fill="#e8e8e8"/>
    <rect x="43" y="80" width="27" height="30" rx="3" fill="#e8e8e8"/>
    <circle cx="40" cy="128" r="7" fill="#e0e0e0"/>
  </g>

  <!-- Phone mockup center-right -->
  <g opacity="0.15" transform="translate(960, 140) rotate(6)">
    <rect width="80" height="140" rx="12" fill="white"/>
    <rect x="6" y="16" width="68" height="100" rx="4" fill="#f5f5f5"/>
    <rect x="10" y="20" width="60" height="14" rx="3" fill="#f68b1e"/>
    <rect x="10" y="40" width="60" height="50" rx="3" fill="#e8e8e8"/>
    <rect x="10" y="96" width="40" height="10" rx="3" fill="#f68b1e" opacity="0.7"/>
    <circle cx="40" cy="128" r="7" fill="#e0e0e0"/>
  </g>

  <!-- African pattern circles — decorative -->
  <circle cx="200" cy="500" r="80" fill="none" stroke="white" stroke-width="1" stroke-dasharray="6 10" opacity="0.12"/>
  <circle cx="200" cy="500" r="50" fill="none" stroke="white" stroke-width="1" stroke-dasharray="4 8" opacity="0.10"/>
  <circle cx="1000" cy="120" r="70" fill="none" stroke="white" stroke-width="1" stroke-dasharray="6 10" opacity="0.12"/>
  <circle cx="1000" cy="120" r="45" fill="none" stroke="white" stroke-width="1" stroke-dasharray="4 8" opacity="0.10"/>

  <!-- Shopping bag icons scattered -->
  <g opacity="0.18" transform="translate(500, 60)">
    <path d="M5 10 L5 30 Q5 35 10 35 L30 35 Q35 35 35 30 L35 10 Z" fill="none" stroke="white" stroke-width="2"/>
    <path d="M12 10 Q12 2 20 2 Q28 2 28 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g opacity="0.15" transform="translate(680, 500)">
    <path d="M5 10 L5 30 Q5 35 10 35 L30 35 Q35 35 35 30 L35 10 Z" fill="none" stroke="white" stroke-width="2"/>
    <path d="M12 10 Q12 2 20 2 Q28 2 28 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g opacity="0.14" transform="translate(820, 80) scale(0.8)">
    <path d="M5 10 L5 30 Q5 35 10 35 L30 35 Q35 35 35 30 L35 10 Z" fill="none" stroke="white" stroke-width="2"/>
    <path d="M12 10 Q12 2 20 2 Q28 2 28 10" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Star bursts -->
  <g opacity="0.25" transform="translate(350, 140)">
    <line x1="0" y1="-16" x2="0" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="white"/>
  </g>
  <g opacity="0.20" transform="translate(860, 460)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2.5" fill="white"/>
  </g>
  <g opacity="0.15" transform="translate(630, 520)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="white" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="white"/>
  </g>

  <!-- Glow overlay on top -->
  <rect width="1200" height="600" fill="url(#glow)"/>

  <!-- Connection dots (map-style) -->
  <circle cx="280" cy="350" r="4" fill="white" opacity="0.3"/>
  <circle cx="580" cy="280" r="5" fill="white" opacity="0.35"/>
  <circle cx="760" cy="380" r="4" fill="white" opacity="0.3"/>
  <circle cx="940" cy="320" r="4" fill="white" opacity="0.28"/>
  <line x1="280" y1="350" x2="580" y2="280" stroke="white" stroke-width="1" stroke-dasharray="4 6" opacity="0.2"/>
  <line x1="580" y1="280" x2="760" y2="380" stroke="white" stroke-width="1" stroke-dasharray="4 6" opacity="0.2"/>
  <line x1="760" y1="380" x2="940" y2="320" stroke="white" stroke-width="1" stroke-dasharray="4 6" opacity="0.2"/>

  <!-- Pulse rings on main dot -->
  <circle cx="580" cy="280" r="18" fill="none" stroke="white" stroke-width="1" opacity="0.15"/>
  <circle cx="580" cy="280" r="30" fill="none" stroke="white" stroke-width="0.8" opacity="0.10"/>
</svg>
