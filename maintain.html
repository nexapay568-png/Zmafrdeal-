<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Under Maintenance</title>
<link rel="icon" href="zmafrdeal.png" type="image/png"/>
<meta name="theme-color" content="#f68b1e"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:#0a0a14;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;position:relative;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;animation:drift 14s ease-in-out infinite alternate;}
.orb1{width:500px;height:500px;background:radial-gradient(circle,#f68b1e,transparent);top:-140px;left:-140px;}
.orb2{width:380px;height:380px;background:radial-gradient(circle,#7c3aed,transparent);bottom:-100px;right:-100px;animation-delay:5s;animation-duration:18s;}
.orb3{width:280px;height:280px;background:radial-gradient(circle,#1890ff,transparent);top:45%;left:58%;animation-delay:2s;animation-duration:22s;}
@keyframes drift{from{transform:translate(0,0) scale(1);}to{transform:translate(28px,18px) scale(1.09);}}
body::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;}
.card{position:relative;z-index:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:52px 44px;max-width:520px;width:100%;text-align:center;backdrop-filter:blur(28px);box-shadow:0 32px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);}
.logo-wrap{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#f68b1e,#e07010);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;box-shadow:0 8px 32px rgba(246,139,30,.38);overflow:hidden;}
.logo-wrap img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.logo-fb{font-size:13px;font-weight:900;color:#fff;letter-spacing:-.5px;display:none;}
.badge{display:inline-flex;align-items:center;gap:7px;background:rgba(246,139,30,.14);color:#f68b1e;border:1px solid rgba(246,139,30,.3);border-radius:40px;padding:5px 15px;font-size:.73rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:22px;}
.dot{width:7px;height:7px;border-radius:50%;background:#f68b1e;animation:blink 1.2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
h1{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.65));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px;line-height:1.2;}
.sub{font-size:.93rem;color:rgba(255,255,255,.62);line-height:1.7;margin-bottom:26px;}
.bar-wrap{background:rgba(255,255,255,.08);border-radius:40px;height:6px;margin-bottom:26px;overflow:hidden;}
.bar{height:100%;border-radius:40px;background:linear-gradient(90deg,#e07010,#f68b1e,#faad14);background-size:200%;animation:shimmer 2.4s linear infinite;}
@keyframes shimmer{0%{background-position:200% center;}100%{background-position:0% center;}}
.steps{text-align:left;margin-bottom:26px;display:flex;flex-direction:column;gap:10px;}
.step{display:flex;align-items:center;gap:10px;font-size:.87rem;color:rgba(255,255,255,.6);}
.sic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.done{background:rgba(82,196,26,.18);color:#52c41a;}
.spin{background:rgba(246,139,30,.18);color:#f68b1e;animation:rot .9s linear infinite;}
@keyframes rot{to{transform:rotate(360deg);}}
.pend{background:rgba(255,255,255,.07);color:rgba(255,255,255,.3);}
.wa-btn{display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none;width:100%;margin-bottom:10px;transition:transform .2s,box-shadow .2s;}
.wa-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(37,211,102,.35);}
.back-btn{display:flex;align-items:center;justify-content:center;gap:6px;color:rgba(255,255,255,.35);background:none;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 18px;font-size:.84rem;cursor:pointer;width:100%;transition:all .2s;}
.back-btn:hover{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.65);}
.foot{margin-top:20px;font-size:.71rem;color:rgba(255,255,255,.28);line-height:1.6;}
@media(max-width:520px){.card{padding:36px 20px;}h1{font-size:1.55rem;}}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="card">
  <div class="logo-wrap">
    <img src="zmafrdeal.png" alt="Logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
    <div class="logo-fb">ZD</div>
  </div>
  <div class="badge"><span class="dot"></span>Under Maintenance</div>
  <h1>We'll Be Right Back</h1>
  <p class="sub">We're making some improvements to give you a better shopping experience. We'll be back very soon — thank you for your patience!</p>
  <div class="bar-wrap"><div class="bar"></div></div>
  <p style="font-size:.8rem;color:rgba(255,255,255,.35);margin-bottom:26px;letter-spacing:.3px;">Maintenance in progress&hellip;</p>
  <a id="zmWaBtn" href="https://wa.me/23277000000" target="_blank" rel="noopener" class="wa-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    Contact Us on WhatsApp
  </a>
  <button class="back-btn" onclick="history.back()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Go Back
  </button>
  <div class="foot">&copy; <span id="zmYear"></span> <span id="zmSN">Zmafrdeal</span>. All rights reserved.</div>
</div>
<script>
document.getElementById('zmYear').textContent = new Date().getFullYear();
(function(){
  var z={};try{z=JSON.parse(localStorage.getItem('zm_store_settings')||'{}');}catch(e){}
  var name=z.storeName||'Zmafrdeal';
  var wa=z.whatsappNumber||'+23277000000';
  document.title='Under Maintenance — '+name;
  document.getElementById('zmSN').textContent=name;
  var waBtn=document.getElementById('zmWaBtn');
  if(waBtn)waBtn.href='https://wa.me/'+wa.replace(/D/g,'');
  if(z.maintenanceMode===false)window.location.replace('index.html');
})();
</script>
</body>
</html>
